# Принятые решения. Инструмент по ним МОЛЧИТ: совпавшие связки уходят в
# свёрнутый раздел «решено ранее».
#
# Сюда переезжает раздел «Что решено и НЕ надо переоткрывать» из docs/OPEN.md.
# Пока решение живёт только текстом в документе, оно не гасит ни одной строки
# отчёта — и обсуждается заново в каждой сессии. Это и есть хождение по кругу.
#
# Оси: продукт, подрядчик, канал, направление, тип.
# Правило срабатывает, когда совпали ВСЕ названные в нём оси. Ось, которую
# правило не называет, не проверяется.
#
# waiting_for — не решение, а вопрос без ответа. Такие строки попадают в
# отдельный раздел «ждёт ответа» и никого не блокируют.
#
# scope — решение действует не на связку, а на целую сверку или на строку
# таблицы. Доступны: sheet_status (снять сверку статусов), sheet_landing
# (подставить лендинг в пустую ячейку «Посадочная»).

- id: sheet-row-adbloggers-landing
  scope: sheet_landing
  row:
    подрядчик: ВК NR
    воронка: ДБО AdBlogger (посевы)
  landing: https://t.ksamata.ru/nrab/dbo/a
  verdict: лендинг взят из письма владельца
  why: >
    В таблице ячейка «Посадочная» у этой строки пуста, и правиться таблица
    не будет (решение 04.08). Без адреса строка не сходится ни с чем:
    ступень «подрядчик + продукт» её не берёт — в таблице «ВК NR» и «ДБО
    AdBlogger (посевы)», в базе «NR» и «ДБО». Адрес прислал владелец 04.08,
    проверен: 200. Воронка по нему заведена в тот же день, и подстановка
    сводит строку с ней штатной ступенью «по лендингу» — а не гасит её.
  since: 2026-08-04

- id: sheet-status-not-authoritative
  scope: sheet_status
  verdict: статус из таблицы маркетологов не сверяем
  why: >
    Решение владельца 04.08: «В таблице маркетологов я ничего не правлю.
    Я считаю, что эти воронки рабочие и выключать их не надо». Колонка
    статуса там не поддерживается, поэтому эталоном живости быть не может.
    Замер того же дня это подтвердил: из семи расхождений шесть оказались
    устаревшими ячейками — по f8, f9, f31, f29 и f28 за июль прошло 9022,
    8124, 11003, 442 и 1288 заказов, а f54 владелец подтвердил живой прямо.
    Живость по-прежнему решают заказы: воронка active без заказов дольше
    порога попадает в «кандидаты в archive», и этот раздел не гаснет.
    Таблица остаётся источником лендингов и самого факта существования
    воронки — строки без воронки в базе показываются как раньше.
  since: 2026-08-04

- id: zhivo-subscription-renewals
  match:
    продукт: [ЖИВО]
    подрядчик: [null]
    канал: [null]
    направление: [null]
    тип: [null]
  verdict: не воронка
  why: >
    Продления подписки «Дом Здоровья ЖИВО», а не заявки из воронки. Разбор
    04.08 на 108 заказах (46 оплаченных, 17.06-31.07): состав заказа
    «Дом Здоровья "ЖИВО". 1 месяц (продление)» и «Продление Покупка #...»,
    этап «Оплата», utm пуст у 99 из 108. Осей у них не будет никогда —
    рекуррентный платёж существующего клиента ни из какой воронки не
    приходит. В трек разметки ГК не идёт: чинить нечего.
  since: 2026-08-04

- id: quiz-not-tracked
  match:
    тип: [АВ Квиз, АВ Квиз-Лайт]
  verdict: не заводим
  why: >
    Решение 29.07, подтверждено 30.07 замером и повторно 04.08 на другом
    наборе: квизы числятся «Стоп», в ЛИК их нет, карточки вышли бы пустыми.
  since: 2026-07-29
